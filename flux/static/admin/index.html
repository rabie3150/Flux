<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Admin</title>
    <link rel="stylesheet" href="/admin/css/vars.css">
    <link rel="stylesheet" href="/admin/css/app.css">
    <link rel="stylesheet" href="/admin/css/responsive.css">
    <script defer src="/admin/js/ui.js"></script>
    <script defer src="/admin/js/app.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Primary">
            <div class="brand">
                <div class="brand-mark">F</div>
                <div>
                    <strong>Flux</strong>
                    <span>Automation Engine</span>
                </div>
            </div>

            <nav class="nav-list">
                <button data-view="dashboard" data-icon="grid">Dashboard</button>
                <button data-view="pipelines" data-icon="flow">Pipelines</button>
                <button data-view="workers" data-icon="worker">Workers</button>
                <button data-view="posts" data-icon="post">Posts</button>
                <button data-view="system" data-icon="gear">System</button>
                <button data-view="plugins" data-icon="plugin">Plugins</button>
                <button data-view="activity" data-icon="pulse">Activity</button>
            </nav>

            <div class="sidebar-footer">
                <span class="health-dot" id="health-dot"></span>
                <span id="health-label">Health unknown</span>
            </div>
        </aside>

        <button class="mobile-backdrop" id="mobile-backdrop" aria-label="Close navigation"></button>

        <main class="main-panel">
            <header class="topbar">
                <button class="icon-button mobile-menu" id="mobile-menu" title="Open navigation">☰</button>
                <div>
                    <p class="eyebrow" id="page-eyebrow">Flux admin</p>
                    <h1 id="page-title">Operations Dashboard</h1>
                </div>
                <div class="topbar-actions" id="topbar-actions"></div>
            </header>

            <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
            <div id="app-view"></div>
        </main>
    </div>

    <div class="modal-backdrop hidden" id="modal">
        <section class="modal-panel">
            <header>
                <div>
                    <p class="eyebrow" id="modal-eyebrow"></p>
                    <h2 id="modal-title"></h2>
                </div>
                <button class="icon-button" id="modal-close" title="Close">x</button>
            </header>
            <div class="modal-body" id="modal-body"></div>
        </section>
    </div>
</body>
</html>
