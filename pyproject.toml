[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-lang"
version = "2.0.0"
description = "Standalone vocabulary translation video generator for language learning."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Flux Operator"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "pydantic>=2.5.0",
    "rich>=13.0.0",
    "edge-tts>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
flux-lang = "flux_lang.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flux_lang*"]

[tool.ruff]
line-length = 100
target-version = "py311"
